<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Auswertung Bodenbedeckung – umgezogen / moved</title>
  <!-- The web app moved from web/ to processing-web/ (2026-10). This stub keeps old
       links and bookmarks working: it forwards to the new location and preserves the
       query string (?lang=…, share links) and the hash. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="../processing-web/">
  <meta http-equiv="refresh" content="0; url=../processing-web/">
  <script>location.replace("../processing-web/" + location.search + location.hash);</script>
</head>
<body>
  <p>Die Anwendung ist umgezogen: <a href="../processing-web/">../processing-web/</a></p>
  <p>The app has moved: <a href="../processing-web/">../processing-web/</a></p>
</body>
</html>
